<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom Siege</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#050510;
    font-family:Arial;
    color:white;
}

canvas{
    display:block;
    background: radial-gradient(circle at center,#111133,#050510);
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    font-size:18px;
}

#godmode{
    position:absolute;
    top:90px;
    left:10px;
    color:lime;
    font-weight:bold;
}

#reloadText{
    position:absolute;
    top:120px;
    left:10px;
    color:orange;
}

#gameOverScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:999;
}

#gameOverScreen h1{
    font-size:60px;
    color:red;
}

button{
    padding:10px 20px;
    font-size:20px;
    margin:10px;
}
</style>
</head>

<body>

<div id="ui">
Health: <span id="health">100</span><br>
Score: <span id="score">0</span><br>
Ammo: <span id="ammo">20</span><br>
Time: <span id="timer">00:00</span>
</div>

<div id="godmode"></div>
<div id="reloadText"></div>

<div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <p id="finalScore"></p>
    <button onclick="location.reload()">Restart</button>
</div>

<canvas id="game"></canvas>

<script>
    document.getElementById("warning").textContent =
    isOutOfBounds ? "RETURN TO BATTLEFIELD!" : "";
    
    function checkBounds(){

    if(
        player.x < 0 ||
        player.x > canvas.width ||
        player.y < 0 ||
        player.y > canvas.height
    ){
        isOutOfBounds = true;
        outOfBoundsTime += 1;
    } else {
        isOutOfBounds = false;
        outOfBoundsTime = 0;
    }

    // 180 frames ≈ 3 seconds (at 60fps)
    if(outOfBoundsTime >= 180){
        if(!infiniteHealth){
            player.health -= 2;
            healthUI.textContent = Math.floor(player.health);
        }
        outOfBoundsTime = 0; // reset after damage
    }
}

    let outOfBoundsTime = 0;
let isOutOfBounds = false;

/* ================= SETUP ================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* ================= VARIABLES ================= */

let score = 0;
let gameOver = false;

let ammo = 20;
let maxAmmo = 20;
let reloading = false;

let keys = {};
let bullets = [];
let phantoms = [];

let infiniteHealth = false;

const player = {
    x: canvas.width/2,
    y: canvas.height/2,
    size: 20,
    speed: 5,
    health: 100
};

let mouse = {x:0,y:0};

const healthUI = document.getElementById("health");
const scoreUI = document.getElementById("score");
const ammoUI = document.getElementById("ammo");
const timerUI = document.getElementById("timer");
const reloadText = document.getElementById("reloadText");

/* ================= TIMER ================= */

let startTime = Date.now();

function updateTimer(){
    if(gameOver) return;

    let elapsed = Math.floor((Date.now() - startTime) / 1000);

    let m = Math.floor(elapsed / 60);
    let s = elapsed % 60;

    timerUI.textContent =
        String(m).padStart(2,"0") + ":" +
        String(s).padStart(2,"0");
}

/* ================= INPUT ================= */

document.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.key.toLowerCase() === "r") reload();

    if(e.key.toLowerCase() === "m"){
        infiniteHealth = !infiniteHealth;
    }
});

document.addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("mousemove", e=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener("click", shoot);

/* ================= GAME ================= */

function shoot(){
    if(gameOver || reloading || ammo <= 0) return;

    ammo--;
    ammoUI.textContent = ammo;

    let angle = Math.atan2(mouse.y-player.y, mouse.x-player.x);

    bullets.push({
        x: player.x,
        y: player.y,
        dx: Math.cos(angle)*10,
        dy: Math.sin(angle)*10,
        size: 5
    });
}

function reload(){
    if(reloading || ammo === maxAmmo || gameOver) return;

    reloading = true;
    reloadText.textContent = "Reloading...";

    setTimeout(()=>{
        ammo = maxAmmo;
        ammoUI.textContent = ammo;
        reloading = false;
        reloadText.textContent = "";
    },1500);
}

/* ================= DIFFICULTY ================= */

let difficultyLevel = 1;

checkBounds();

function updateDifficulty(){
    let elapsed = Math.floor((Date.now() - startTime) / 1000);

    if(elapsed >= 600) difficultyLevel = 3;
    else if(elapsed >= 300) difficultyLevel = 2;
    else difficultyLevel = 1;
}

/* ================= SPAWN ================= */

function spawnPhantom(){
    let side = Math.floor(Math.random()*4);
    let x,y;

    if(side===0){x=Math.random()*canvas.width;y=-50;}
    if(side===1){x=canvas.width+50;y=Math.random()*canvas.height;}
    if(side===2){x=Math.random()*canvas.width;y=canvas.height+50;}
    if(side===3){x=-50;y=Math.random()*canvas.height;}

    phantoms.push({
        x,y,
        size:25,
        speed:(1+Math.random()*2) * difficultyLevel
    });
}

setInterval(spawnPhantom,1000);

/* ================= UPDATE ================= */

function update(){

    if(gameOver) return;

    updateTimer();
    updateDifficulty();

    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;

    bullets.forEach((b,i)=>{
        b.x += b.dx;
        b.y += b.dy;
        if(b.x<0||b.x>canvas.width||b.y<0||b.y>canvas.height)
            bullets.splice(i,1);
    });

    phantoms.forEach((p,pi)=>{

        let angle = Math.atan2(player.y-p.y, player.x-p.x);

        p.x += Math.cos(angle)*p.speed;
        p.y += Math.sin(angle)*p.speed;

        let dx = player.x - p.x;
        let dy = player.y - p.y;

        if(Math.sqrt(dx*dx+dy*dy) < player.size + p.size){

            if(!infiniteHealth){
                player.health -= 0.3;
                healthUI.textContent = Math.floor(player.health);
            }

            if(!infiniteHealth && player.health <= 0 && !gameOver){
                gameOver = true;

                document.getElementById("finalScore").innerHTML =
                    "Score: " + score +
                    "<br>Survived: " + timerUI.textContent;

                document.getElementById("gameOverScreen").style.display="flex";
            }
        }
    });

    document.getElementById("godmode").textContent =
        infiniteHealth ? "INFINITE HEALTH ON (Michael)" : "";

    reloadText.textContent = reloading ? "Reloading..." : "";
}

/* ================= DRAW ================= */

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    let angle = Math.atan2(mouse.y-player.y, mouse.x-player.x);

    ctx.save();
    ctx.translate(player.x,player.y);
    ctx.rotate(angle);

    ctx.fillStyle="cyan";
    ctx.beginPath();
    ctx.moveTo(25,0);
    ctx.lineTo(-15,-12);
    ctx.lineTo(-15,12);
    ctx.fill();

    ctx.restore();

    ctx.fillStyle="yellow";
    bullets.forEach(b=>{
        ctx.beginPath();
        ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
        ctx.fill();
    });

    ctx.fillStyle="white";
    phantoms.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    });
}

/* ================= LOOP ================= */

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

</script>

</body>
</html>
